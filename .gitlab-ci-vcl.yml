image: $CI_REGISTRY/qqvp/vcl/containers/kvm-dev-ubuntu:latest

stages:
  - build

build:
  stage: build
  tags:
    - linux
  script:
    - meson setup build/release --prefix `pwd`/build/install --buildtype release -Dplatforms=auto 
    - ninja -C build/release install
  artifacts:
    when: always
    paths:
      - build/install
